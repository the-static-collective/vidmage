name: VIDMAGE BAND-IQ 002 Selected Lens Real Film Loop
on:
  push:
    branches: [experiment/band-iq-002-lens-to-film-loop]
  pull_request:
    paths:
      - "bridge/band_iq_film_loop.py"
      - "bridge/scene_card_film.py"
      - "tests/test_band_iq_film_loop.py"
      - "docs/BAND_IQ_002.md"
      - ".github/workflows/band-iq-002.yml"
permissions:
  contents: read
jobs:
  pure-lens-refusals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Minimal bounded video math dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<5'
      - name: Six genuinely different frame transformations and source-plan checks
        run: python -m unittest -v tests/test_band_iq_film_loop.py
      - name: Compile all changed native bridge code
        run: python -m compileall -q bridge tests
  pinned-full-movie:
    needs: pure-lens-refusals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin exact native source donors
        run: |
          git clone --quiet https://github.com/the-static-collective/the-haunted-blender.git donor-blender
          git -C donor-blender checkout --detach cf0256a49ac8aa879cf2a044847d248177fcfad9
          test "$(git -C donor-blender rev-parse HEAD)" = cf0256a49ac8aa879cf2a044847d248177fcfad9
          git clone --quiet https://github.com/the-static-collective/the-haunted-toaster.git donor-toaster
          git -C donor-toaster checkout --detach 3652c2a96b6b287cda316d1c92daadf7c7417eaf
          test "$(git -C donor-toaster rev-parse HEAD)" = 3652c2a96b6b287cda316d1c92daadf7c7417eaf
      - name: Install CPU-only owner-local media tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow==12.1.1 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<5'
      - name: Native Toaster and Blender film/parts/material/rescore proof
        env:
          VIDMAGE_BLENDER_ROOT: ${{ github.workspace }}/donor-blender
          VIDMAGE_TOASTER_ROOT: ${{ github.workspace }}/donor-toaster
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/donor-blender
        run: |
          python -m unittest -v tests/test_band_iq_film_loop.py
          python -m unittest -v tests/test_scene_card_film.py tests/test_band_iq.py tests/test_band_iq_donors.py
      - name: Do not persist synthetic rendered media
        run: |
          test ! -d ./media
          test ! -d ./private
