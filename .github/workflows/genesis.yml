name: VIDMAGE Genesis Checks

on:
  push:
    branches: [main, "genesis/**"]
  pull_request:

permissions:
  contents: read

jobs:
  provenance:
    name: Offline donor-lock tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out VIDMAGE
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run repo tests
        run: npm test
      - name: Verify donor pins
        run: npm run verify:donors
