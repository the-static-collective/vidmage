name: VIDMAGE BAND-IQ 008 Living Workbench
on:
  push:
    branches: [experiment/band-iq-008-living-workbench]
  pull_request:
    paths:
      - "bridge/band_iq_workbench.py"
      - "bridge/band_iq_ac_review.py"
      - "ui/band_iq_workbench.html"
      - "ui/band_iq_workbench.css"
      - "ui/band_iq_workbench.js"
      - "ui/band_iq_review.js"
      - "ui/band_iq_ac_review.html"
      - "ui/band_iq_ac_review.js"
      - "tests/test_band_iq_workbench.py"
      - "docs/BAND_IQ_008.md"
      - ".github/workflows/band-iq-008.yml"
permissions:
  contents: read
jobs:
  single-local-workshop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Existing source-only Python requirements
        run: python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<5'
      - name: Source-verified first room, revised room, workbench resume and CSRF boundaries
        run: |
          python -m unittest -v tests/test_band_iq_workbench.py
          python -m unittest -v tests/test_band_iq_ac_review.py tests/test_band_iq_review.py
          python -m compileall -q bridge tests
      - name: Browser executable syntax and no remote assets
        run: |
          node --check ui/band_iq_workbench.js
          node --check ui/band_iq_review.js
          node --check ui/band_iq_ac_review.js
          ! grep -E 'https?://|<script[^>]+src="https?://' ui/band_iq_workbench.html
          ! grep -E 'https?://|<script[^>]+src="https?://' ui/band_iq_ac_review.html
          ! grep -E 'https?://|<script[^>]+src="https?://' ui/band_iq_review.html
  real-three-film-custody-through-one-branch:
    needs: single-local-workshop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exact source-pinned donors
        run: |
          git clone --quiet https://github.com/the-static-collective/the-haunted-blender.git donor-blender
          git -C donor-blender checkout --detach cf0256a49ac8aa879cf2a044847d248177fcfad9
          test "$(git -C donor-blender rev-parse HEAD)" = cf0256a49ac8aa879cf2a044847d248177fcfad9
          git clone --quiet https://github.com/the-static-collective/the-haunted-toaster.git donor-toaster
          git -C donor-toaster checkout --detach 3652c2a96b6b287cda316d1c92daadf7c7417eaf
          test "$(git -C donor-toaster rev-parse HEAD)" = 3652c2a96b6b287cda316d1c92daadf7c7417eaf
          git clone --quiet https://github.com/the-static-collective/playdeck.git donor-playdeck
          git -C donor-playdeck checkout --detach 012186fd67f4c4ef1c6591fc5e29cb559b5a80d0
          test "$(git -C donor-playdeck rev-parse HEAD)" = 012186fd67f4c4ef1c6591fc5e29cb559b5a80d0
      - name: CPU local cinema and native Remotion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow==12.1.1 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<5'
          npm --prefix donor-playdeck install --no-audit --no-fund
      - name: Actually render A B C and preserve all human review boundaries
        env:
          VIDMAGE_BLENDER_ROOT: ${{ github.workspace }}/donor-blender
          VIDMAGE_TOASTER_ROOT: ${{ github.workspace }}/donor-toaster
          VIDMAGE_PLAYDECK_ROOT: ${{ github.workspace }}/donor-playdeck
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/donor-blender
        run: |
          python -m unittest -v tests/test_band_iq_playdeck_native.py
          python -m unittest -v tests/test_band_iq_workbench.py
      - name: No real artist media or receipts in source control
        run: |
          test ! -d ./private
          test ! -d ./media
