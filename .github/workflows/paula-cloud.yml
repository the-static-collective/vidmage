name: Paula Pocket Cloud Tests
on:
  push:
    paths: ['paula/**', 'paula_cloud/**', 'tests/test_paula_cloud.py', 'tests/test_paula_receipt.py', '.github/workflows/paula-cloud.yml']
  pull_request:
    paths: ['paula/**', 'paula_cloud/**', 'tests/test_paula_cloud.py', 'tests/test_paula_receipt.py', '.github/workflows/paula-cloud.yml']
jobs:
  receipt-to-mp4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r paula_cloud/requirements.txt pytest httpx
      - run: python -m pytest -q tests/test_paula_cloud.py tests/test_paula_receipt.py
