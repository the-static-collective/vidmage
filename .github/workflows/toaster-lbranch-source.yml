name: VIDMAGE Pinned Toaster L Branch Fixture
on:
  push:
    branches: ["experiment/toaster-lbranch-blender-director-001"]
    paths: [".github/workflows/toaster-lbranch-source.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned public Toaster code
        run: |
          git clone --quiet https://github.com/the-static-collective/the-haunted-toaster.git toaster
          git -C toaster checkout --detach 3652c2a96b6b287cda316d1c92daadf7c7417eaf
          test "$(git -C toaster rev-parse HEAD)" = 3652c2a96b6b287cda316d1c92daadf7c7417eaf
      - name: Keep exact L Branch and analysis modules, no user media
        run: |
          mkdir -p export/src/full-measure/src
          cp -a toaster/src/full-measure/src/generation export/src/full-measure/src/
          cp -a toaster/src/full-measure/src/render export/src/full-measure/src/
          cp -a toaster/src/full-measure/tests/l-branch-evidence-bus.test.cjs export/src/full-measure/src/l-branch-evidence-bus.test.cjs
          tar -czf toaster-lbranch-source.tar.gz -C export .
          sha256sum toaster-lbranch-source.tar.gz > source.sha256
      - name: Upload pinned public source
        uses: actions/upload-artifact@v4
        with:
          name: toaster-lbranch-source-3652c2a96
          path: |
            toaster-lbranch-source.tar.gz
            source.sha256
          retention-days: 1
